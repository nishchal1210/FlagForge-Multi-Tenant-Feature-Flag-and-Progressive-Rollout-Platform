name: FlagForge CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flagforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-tests:
    name: SDK reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql+psycopg://unused:unused@localhost:5432/unused
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sdk/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e ./sdk
          python -m pip install "pytest>=8,<10"
          python -m pip check

      - name: Run targeted reliability suite
        run: |
          mkdir -p .pytest_tmp
          python -m pytest tests/sdk tests/realtime -q \
            --basetemp=.pytest_tmp/ci

  docker-integration:
    name: Docker integration check
    runs-on: ubuntu-latest
    needs: sdk-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SDK for integration script
        run: python -m pip install ./sdk

      - name: Prepare CI configuration
        run: cp .env.docker.example .env.ci

      - name: Validate Compose configuration
        run: docker compose --env-file .env.ci config --quiet

      - name: Build and start backend
        run: docker compose --env-file .env.ci up --build -d

      - name: Run integration checks
        env:
          FLAGFORGE_TEST_URL: http://127.0.0.1:8001
        run: python scripts/ci_smoke.py

      - name: Show service status
        if: always()
        run: docker compose --env-file .env.ci ps -a

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.ci logs \
            --no-color --tail 200 migrate api postgres redis

      - name: Stop the CI stack
        if: always()
        run: docker compose --env-file .env.ci down